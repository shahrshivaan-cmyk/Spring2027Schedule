<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F4EF;--card:#fff;--ink:#17181A;--mute:#7A7A75;--faint:#B5B5AE;--line:#E6E5DF;--soft:#F0EFE9;--accent:#1F6F4A;--accent-soft:#E3F1E9;--danger:#DC2626;--danger-soft:#FEF2F2;--star:#E8A317}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
@media(max-width:600px){.wrap{padding:0 14px}}

/* header */
.hdr{background:var(--ink);color:#fff;padding:16px 0}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-size:19px;font-weight:700;letter-spacing:-.4px}
.logo small{font-size:11px;font-weight:600;background:#2b2c2f;color:#9a9a95;padding:3px 9px;border-radius:12px;margin-left:8px;letter-spacing:0;vertical-align:2px}
.me{display:flex;align-items:center;gap:8px}
.live{display:flex;align-items:center;gap:6px;background:#26272a;padding:4px 10px;border-radius:14px;font-size:11px;color:#aaa}
.live i{width:6px;height:6px;border-radius:50%;background:#34D399;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.me-name{font-size:13px;font-weight:600}
.ghost{background:none;border:1px solid #3a3b3e;color:#bbb;font-size:11px;font-weight:600;padding:4px 10px;border-radius:7px}
.ghost:hover{color:#fff;border-color:#666}

/* stats + tabs */
.bar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 0;position:sticky;top:0;z-index:20}
.bar .wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.stat b{font-size:21px;font-weight:700}.stat span{font-size:11px;color:var(--mute);margin-left:4px}
.tabs{margin-left:auto;display:flex;background:var(--soft);border-radius:9px;padding:3px}
.tab{border:none;background:none;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--mute);border-radius:7px}
.tab.on{background:var(--ink);color:#fff}
.tab:not(.on):hover{background:#e6e5df}
@media(max-width:600px){.bar .wrap{gap:14px}.tabs{margin-left:0;width:100%}.tab{flex:1;padding:8px 6px}}

main{padding:16px 0 60px}
.alert{background:var(--danger-soft);border:1px solid #FECACA;border-radius:10px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:#991B1B}
.alert .sp{flex:1;min-width:160px}
.btn-red{background:var(--danger);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

.filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.filters input,.filters select{padding:9px 12px;border-radius:8px;border:1px solid #dcdbd4;font-size:12.5px;background:#fff;outline:none;color:var(--ink)}
.filters input{flex:1;min-width:160px}
.filters input:focus,.filters select:focus{border-color:var(--ink)}
.sortbar{display:flex;gap:3px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.sortbar .lbl{font-size:11px;color:var(--faint);margin-right:2px}
.pill{border:none;background:none;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:6px;color:var(--mute)}
.pill.on{background:var(--ink);color:#fff}
.pill:not(.on):hover{background:#eae9e3}
.pill.fr.on{background:var(--star);color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec-h{padding:9px 14px;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);background:#FAFAF7;border-bottom:1px solid var(--line)}
.cr{padding:11px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
.cr:not(:last-child){border-bottom:1px solid #f1f0ea}
.cr:hover{background:#FAFAF7}
.cr.sel{border-left-color:var(--bc);background:var(--bbg)}
.cbox{width:19px;height:19px;border-radius:5px;border:2px solid #cfcec7;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:11px;font-weight:700}
.cr.sel .cbox{border-color:var(--bc);background:var(--bc)}
.chip{display:inline-flex;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.ttl{font-size:13px;font-weight:600}
.meta{font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.45}
.meta .d{color:#d6d5ce;margin:0 4px}
.tag{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap}
.tag.conf{background:#FEE2E2;color:var(--danger)}
.tag.ses{background:#EEF2FF;color:#4338CA}
.tag.note{background:#FFF7E6;color:#A16207}
.mates{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.035);white-space:nowrap;flex-shrink:0}
.mates:hover{background:rgba(0,0,0,.07)}
.mates.has-fr{background:#FDF3DC}
.mini{width:21px;height:21px;font-size:8.5px;margin-left:-7px;border:2px solid #fff}
.mini:first-child{margin-left:0}
.mates .n{font-size:11px;color:var(--mute);font-weight:700;margin-left:2px}
.exp{padding:8px 14px 12px 47px;background:#FAFAF7;border-bottom:1px solid #f1f0ea}
.exp .lbl{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.namechips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:3px 10px 3px 3px;font-size:12px;font-weight:500;cursor:pointer}
.nchip:hover{border-color:#bbb}
.nchip.fr{border-color:#F3D27A;background:#FFFBEF}

.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:70px}
.side h3{font-size:13.5px;font-weight:700;margin-bottom:10px}
.empty{font-size:12px;color:var(--faint);text-align:center;padding:18px 8px;line-height:1.5}
.sc{padding:8px 10px;margin-bottom:5px;border-radius:8px;display:flex;align-items:center;gap:8px}
.sc .code{font-size:11.5px;font-weight:700}
.sc .t{font-size:11px;color:#555;margin-top:1px}
.x{background:none;border:none;font-size:16px;color:#999;line-height:1;padding:0 2px}
.x:hover{color:var(--ink)}
.cta{width:100%;margin-top:10px;padding:10px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:12.5px;font-weight:600}
.cta:hover{background:#333}
.cta.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}

/* calendar */
.cal-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px}
.cal-tools select{padding:8px 10px;border-radius:8px;border:1px solid #dcdbd4;font-size:12.5px;background:#fff}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.cg{display:grid;grid-template-columns:48px repeat(4,minmax(130px,1fr));min-width:600px}
.dh{height:38px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#555;letter-spacing:.6px}
.dc{border-left:1px solid #f1f0ea}
.body{position:relative}
.hl{position:absolute;left:0;right:0;border-top:1px solid #f3f2ed}
.tl{position:absolute;right:6px;font-size:9.5px;color:var(--faint);font-family:'DM Mono',monospace;transform:translateY(-50%)}
.blk{position:absolute;border-radius:6px;color:#fff;padding:5px 6px;font-size:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.blk.conf{outline:2px solid var(--danger);outline-offset:1px}
.blk.ghost{background:repeating-linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.9) 5px,rgba(255,255,255,.75) 5px,rgba(255,255,255,.75) 10px)!important;color:var(--ink);border:2px dashed var(--gc);box-shadow:none}
.blk .c{font-weight:700;font-size:11px;line-height:1.15}
.blk .tt{opacity:.92;font-size:9.5px;margin-top:1px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .s{opacity:.75;font-size:9px;margin-top:1px}
.legend{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--mute)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.offgrid{margin-top:12px}

/* people */
.share{background:linear-gradient(135deg,#17181A,#26342D);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.share .txt{flex:1;min-width:220px}
.share h3{font-size:15px;font-weight:700;margin-bottom:3px}
.share p{font-size:12px;color:#a9b3ad}
.share .url{font-family:'DM Mono',monospace;font-size:11.5px;color:#d7e2dc;margin-top:8px;word-break:break-all}
.share .acts{display:flex;gap:8px;flex-wrap:wrap}
.b-w{background:#fff;color:var(--ink);border:none;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:600}
.b-wa{background:#25D366;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:14px;font-weight:700}
.panel .sub{font-size:11.5px;color:var(--mute);margin:2px 0 12px}
.panel input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #dcdbd4;font-size:12.5px;margin-bottom:8px;outline:none}
.pr{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:8px;cursor:pointer}
.pr:hover{background:#FAFAF7}
.pr.on{background:var(--accent-soft)}
.pr .nm{font-size:13px;font-weight:600}
.pr .mt{font-size:11px;color:var(--mute);margin-top:1px}
.star{background:none;border:none;font-size:17px;line-height:1;color:#d4d3cc;padding:2px}
.star.on{color:var(--star)}
.shared{text-align:right;min-width:42px}
.shared b{font-size:17px;color:var(--accent)}
.shared div{font-size:9.5px;color:var(--mute)}
.pop{display:flex;align-items:center;gap:10px;padding:9px 0}
.pop:not(:last-child){border-bottom:1px solid #f3f2ed}
.rank{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0}
.add{padding:5px 11px;border-radius:7px;border:1px solid #dcdbd4;background:#fff;color:#555;font-size:11.5px;font-weight:600;white-space:nowrap}
.add.on{border-color:transparent;color:#fff}
.prof-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prof-h .nm{font-size:16px;font-weight:700}
.prof-h .mt{font-size:12px;color:var(--mute)}
.pc{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f2ed}
.pc:last-child{border-bottom:none}

/* onboarding */
.ob{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.ob-box{width:100%;max-width:420px;text-align:center;animation:up .45s ease}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.ob .em{font-size:46px;margin-bottom:12px}
.ob h1{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.ob p{font-size:13.5px;color:var(--mute);line-height:1.55;margin-bottom:22px}
.ob .row{display:flex;gap:8px}
.ob input{flex:1;min-width:0;padding:13px 16px;border-radius:11px;border:1px solid #d6d5ce;font-size:15px;outline:none;background:#fff}
.ob input:focus{border-color:var(--ink)}
.ob .go{padding:13px 24px;border-radius:11px;border:none;background:var(--ink);color:#fff;font-size:15px;font-weight:600}
.ob .info{margin-top:18px;font-size:12px;color:var(--mute)}
.ob .claim{margin-top:22px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.ob .claim .lbl{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.ob .claim .namechips{max-height:170px;overflow:auto}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:99;animation:up .25s ease}
.loading{min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--mute);font-size:14px}
.spin{width:30px;height:30px;border:3px solid #e5e4de;border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ob .pin{width:120px;flex:0 0 120px;text-align:center;letter-spacing:6px;font-family:'DM Mono',monospace}
.ob .hint{font-size:11.5px;color:var(--mute);margin-top:8px;text-align:left}
.ob .err{font-size:12.5px;color:var(--danger);margin-top:10px;min-height:16px}
.ob .back{background:none;border:none;color:var(--mute);font-size:12.5px;margin-top:14px;text-decoration:underline}
.ob .who{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px;font-size:16px;font-weight:600}
.foot{text-align:center;font-size:11px;color:var(--faint);padding:10px 0 30px}
</style>

function hc(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return AVC[Math.abs(h)%AVC.length]}
function ini(n){return (n||"?").trim().split(/\s+/).map(w=>w[0]).join("").toUpperCase().slice(0,2)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function av(n,size){const f=Math.round(size*.38);return`<span class="av" style="width:${size}px;height:${size}px;font-size:${f}px;background:${hc(n)}">${esc(ini(n))}</span>`}

function parseTime(s){const m=s.match(/(\d+):?(\d*)\s*([ap]m)/i);if(!m)return 0;let h=+m[1],mi=m[2]?+m[2]:0;const ap=m[3].toLowerCase();if(ap==="pm"&&h!==12)h+=12;if(ap==="am"&&h===12)h=0;return h*60+mi}
const DAYMAP={M:["Mon"],W:["Wed"],Tu:["Tue"],Th:["Thu"],MW:["Mon","Wed"],TTh:["Tue","Thu"]};
function parsePattern(p){const tp=p.match(/\d+:?\d*\s*[ap]m\s*-\s*\d+:?\d*\s*[ap]m/i);if(!tp)return[];const[a,b]=tp[0].split("-");const start=parseTime(a),end=parseTime(b);const days=DAYMAP[p.replace(tp[0],"").trim()];return days?days.map(day=>({day,start,end})):[]}
function fmt(m){const h=Math.floor(m/60),mi=m%60;return`${h>12?h-12:h||12}:${String(mi).padStart(2,"0")}${h>=12?"pm":"am"}`}

const BYID=Object.fromEntries(COURSES.map(c=>[c.id,c]));

function load(){try{const d=JSON.parse(localStorage.getItem(LS)||"null");if(d){me={id:d.id||"",name:d.name||""};selected=new Set(d.sel||[]);friends=new Set(d.fr||[]);view=d.view||"list"}}catch(e){}}

let pushT=null;
function memberDoc(extra){const d={name:me.name,owner:uid,courses:[...selected],updated:Date.now()};const cur=members[me.id];if(cur&&cur.legacyId)d.legacyId=cur.legacyId;return Object.assign(d,extra||{})}
function push(){if(!me.id||!uid)return;clearTimeout(pushT);pushT=setTimeout(()=>{db.ref(ROOT+"/members/"+me.id).set(memberDoc()).catch(e=>{console.error(e);toast("Couldn't save — you can only edit your own classes");me={id:"",name:""};save();render()})},350)}
async function pinHash(id,pin){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sp27:"+roomId+":"+id+":"+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function rebuildUsers(){users={};const claimed=new Set(Object.values(members).map(m=>m&&m.legacyId).filter(Boolean));Object.entries(members).forEach(([id,m])=>{if(m&&m.name)users[id]=m});Object.entries(legacy).forEach(([id,u])=>{if(u&&u.name&&!claimed.has(id))users["legacy:"+id]=Object.assign({},u,{legacy:true})})}
function owns(id){return !!(uid&&members[id]&&members[id].owner===uid)}

function compatible(a,b){return !((a==="q1"&&b==="q2")||(a==="q2"&&b==="q1"))}
function conflictsFor(ids){const sel=[...ids].map(i=>BYID[i]).filter(Boolean),out=[];for(let i=0;i<sel.length;i++)for(let j=i+1;j<sel.length;j++){if(!compatible(sel[i].session,sel[j].session))continue;if(sel[i].slots.some(a=>sel[j].slots.some(b=>a.day===b.day&&a.start<b.end&&b.start<a.end)))out.push([sel[i],sel[j]])}return out}

function others(){return Object.entries(users).filter(([id,u])=>id!==me.id&&u&&u.name)}
function matesMap(){const m={};COURSES.forEach(c=>m[c.id]=[]);others().forEach(([id,u])=>(u.courses||[]).forEach(cid=>{if(m[cid])m[cid].push({id,name:u.name})}));Object.values(m).forEach(a=>a.sort((x,y)=>(friends.has(y.id)-friends.has(x.id))||x.name.localeCompare(y.name)));return m}

function newId(n){return n.toLowerCase().replace(/[^a-z0-9]/g,"_").slice(0,30)+"_"+Math.random().toString(36).slice(2,7)}
function obErr(m){ob.err=m;busy=false;render()}
function pinOk(p){return /^\d{4,8}$/.test(p)}
async function join(){if(busy)return;const v=(document.getElementById("nm").value||"").trim().replace(/\s+/g," ").slice(0,60);const p=(document.getElementById("pin").value||"").trim();
  if(!v)return obErr("Enter your name.");if(!pinOk(p))return obErr("Pick a PIN of 4–8 digits.");if(!uid)return obErr("Still connecting — try again in a second.");
  if(Object.values(users).some(u=>u.name.trim().toLowerCase()===v.toLowerCase()))return obErr("That name is already on the list — tap it below to log back in.");
  busy=true;const id=newId(v);const legacyId=ob.target&&ob.target.startsWith("legacy:")?ob.target.slice(7):null;
  const courses=legacyId&&legacy[legacyId]?(legacy[legacyId].courses||[]):[...selected];
  const doc={name:v,owner:uid,courses,updated:Date.now()};if(legacyId)doc.legacyId=legacyId;
  try{await db.ref(ROOT).update({["members/"+id]:doc,["secrets/"+id]:await pinHash(id,p)});members[id]=doc;me={id,name:v};selected=new Set(courses);busy=false;ob={mode:"new",target:null,err:""};save();rebuildUsers();render();toast("You're in — your classes are locked to your PIN 🔒")}
  catch(e){console.error(e);obErr("Couldn't save — try again.")}}
async function login(){if(busy)return;const id=ob.target,m=members[id];const p=(document.getElementById("pin").value||"").trim();if(!m)return;if(!pinOk(p))return obErr("Enter your 4–8 digit PIN.");if(!uid)return obErr("Still connecting — try again in a second.");
  busy=true;try{const h=await pinHash(id,p);await db.ref(ROOT+"/claims/"+id+"/"+uid).set(h);const doc=Object.assign({},m,{owner:uid,updated:Date.now()});await db.ref(ROOT+"/members/"+id).set(doc);members[id]=doc;me={id,name:m.name};selected=new Set(m.courses||[]);busy=false;ob={mode:"new",target:null,err:""};save();render();toast("Welcome back, "+m.name.split(" ")[0])}
  catch(e){console.error(e);obErr("Wrong PIN for "+m.name+".")}}
function pick(id){const u=users[id];if(!u)return;if(u.legacy){ob={mode:"legacy",target:id,err:""};render();setTimeout(()=>{const n=document.getElementById("nm");if(n)n.value=u.name;const q=document.getElementById("pin");q&&q.focus()},0);return}
  if(owns(id)){me={id,name:u.name};selected=new Set(u.courses||[]);save();render();return}
  ob={mode:"login",target:id,err:""};render()}
function obBack(){ob={mode:"new",target:null,err:""};render()}
function signOut(){me={id:"",name:""};selected=new Set();ob={mode:"new",target:null,err:""};save();render()}
function toggle(id){if(!owns(me.id)){toast("Log in with your PIN to edit");signOut();return}selected.has(id)?selected.delete(id):selected.add(id);save();push();render()}
function star(id,ev){ev&&ev.stopPropagation();friends.has(id)?friends.delete(id):friends.add(id);save();render()}

    <div class="logo">Spring 2027<small>Goizueta FTMBA</small></div>
    <div class="me"><div class="live"><i></i>${total} in</div>${av(me.name,30)}<span class="me-name">${esc(me.name)}</span><button class="ghost" onclick="signOut()">Log out</button></div>
  </div></div>
  <div class="bar"><div class="wrap">
    <div class="stat"><b>${selected.size}</b><span>courses</span></div>
    <div class="stat"><b>${(mins/60).toFixed(1)}</b><span>hrs/wk</span></div>
    <div class="stat"><b style="color:${conf.length?"var(--danger)":"var(--accent)"}">${conf.length}</b><span>conflicts</span></div>
    <div class="stat"><b>${overlapPeople}</b><span>classmates overlap</span></div>
    <div class="tabs">
      <button class="tab ${view==="list"?"on":""}" onclick="go('list')">Courses</button>
      <button class="tab ${view==="week"?"on":""}" onclick="go('week')">My week</button>
      <button class="tab ${view==="people"?"on":""}" onclick="go('people')">Classmates</button>
    </div>
  </div></div><main><div class="wrap">`;
  conf.forEach(([a,b])=>{h+=`<div class="alert"><span>⚠️</span><span class="sp"><b>${esc(code(a))}</b> overlaps <b>${esc(code(b))}</b></span><button class="btn-red" onclick="toggle('${a.id}')">Drop ${esc(code(a))}</button><button class="btn-red" onclick="toggle('${b.id}')">Drop ${esc(code(b))}</button></div>`});
  if(view==="list")h+=renderList(sel,confIds,mm);
  else if(view==="week")h+=renderWeek(sel,confIds,mm);
  else h+=renderPeople(mm);
  h+=`</div></main><div class="foot">Course data from SP27 FTMBA Schedule (10/28/26). Always confirm in OPUS.</div>`;
  app.innerHTML=h;
}

  const list=Object.entries(users).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const err=`<div class="err">${esc(ob.err)}</div>`;
  if(ob.mode==="login"){const m=members[ob.target];
    return`<div class="ob"><div class="ob-box"><div class="who">${av(m?m.name:"?",34)}${esc(m?m.name:"")}</div>
    <p>Enter your PIN to edit your classes on this device.</p>
    <div class="row" style="justify-content:center"><input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN" onkeydown="if(event.key==='Enter')login()"><button class="go" onclick="login()">Log in</button></div>${err}
    <button class="back" onclick="obBack()">Not you? Go back</button></div></div>`}

    <h1>Spring 2027 Schedule</h1>

    <div class="hint">🔒 Pick a 4–8 digit PIN. Only you can change your classes, and you'll use the PIN on any other phone or laptop.</div>${err}
    ${legacyMode?`<button class="back" onclick="obBack()">Go back</button>`:`<div class="info">${list.length?`🟢 ${list.length} ${list.length===1?"classmate has":"classmates have"} joined`:"You're the first one here — share the link after you join!"}</div>
    ${list.length?`<div class="claim"><div class="lbl">Already joined? Tap your name</div><div class="namechips">${list.map(([id,u])=>`<span class="nchip" onclick="pick('${id}')">${av(u.name,22)}${esc(u.name)}${u.legacy?" · set PIN":""}</span>`).join("")}</div></div>`:""}`}

function rowHTML(c,confIds,mm){
  const s=selected.has(c.id),k=col(c),mates=mm[c.id]||[],fr=mates.filter(m=>friends.has(m.id));
  let r=`<div class="cr${s?" sel":""}" style="--bc:${k.b};--bbg:${k.bg}" onclick="toggle('${c.id}')">
    <div class="cbox">${s?"✓":""}</div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span class="chip" style="background:${k.bg};color:${k.t}">${esc(code(c))}</span><span class="ttl">${esc(c.title)}</span>
      ${SESS[c.session]&&c.group!=="ACE"&&c.group!=="DC"?`<span class="tag ses">${SESS[c.session]}</span>`:""}
      ${c.note?`<span class="tag note">${esc(c.note)}</span>`:""}
      ${confIds.has(c.id)?`<span class="tag conf">CONFLICT</span>`:""}</div>
      <div class="meta">${esc(c.prof)}<span class="d">·</span>${esc(c.pattern)}<span class="d">·</span>${esc(c.loc)}${c.sect?`<span class="d">·</span>Sec ${esc(c.sect)}`:""}</div>
    </div>
    ${mates.length?`<div class="mates${fr.length?" has-fr":""}" title="See who's taking this" onclick="event.stopPropagation();expanded=expanded==='${c.id}'?null:'${c.id}';render()">${mates.slice(0,3).map(m=>`<span class="av mini" style="background:${hc(m.name)}">${esc(ini(m.name)[0])}</span>`).join("")}<span class="n">${mates.length}${fr.length?` · ★${fr.length}`:""}</span></div>`:""}
  </div>`;
  if(expanded===c.id&&mates.length)r+=`<div class="exp"><div class="lbl">Also taking this</div><div class="namechips">${mates.map(m=>`<span class="nchip${friends.has(m.id)?" fr":""}" onclick="openPerson('${m.id}')">${av(m.name,22)}${esc(m.name)}${friends.has(m.id)?" ★":""}</span>`).join("")}</div></div>`;
  return r;
}

function renderList(sel,confIds,mm){
  const subjs=[...new Set(COURSES.map(c=>c.subj))].sort();
  const q=search.toLowerCase();
  let f=COURSES.filter(c=>{
    if(fSubj!=="ALL"&&c.subj!==fSubj)return false;
    if(q&&!`${c.title} ${c.subj} ${c.cat} ${c.prof} ${c.id}`.toLowerCase().includes(q)&&!(mm[c.id]||[]).some(m=>m.name.toLowerCase().includes(q)))return false;
    if(fWhen==="DAY"&&(!c.slots.length||c.slots.some(s=>s.start>=18*60)))return false;
    if(fWhen==="EVE"&&(!c.slots.length||c.slots.every(s=>s.start<18*60)))return false;
    if(fWhen==="MW"&&!c.slots.some(s=>s.day==="Mon"||s.day==="Wed"))return false;
    if(fWhen==="TTH"&&!c.slots.some(s=>s.day==="Tue"||s.day==="Thu"))return false;
    if(fWhen==="SHORT"&&c.slots.length)return false;
    if(onlyFriends&&!(mm[c.id]||[]).some(m=>friends.has(m.id)))return false;
    return true;
  });
  const order={CORE:0,ELECTIVE:1,ACE:2,DC:3};
  if(sortBy==="popular")f.sort((a,b)=>(mm[b.id].length-mm[a.id].length)||a.title.localeCompare(b.title));
  else if(sortBy==="time")f.sort((a,b)=>((a.slots[0]?.start??9999)-(b.slots[0]?.start??9999))||a.subj.localeCompare(b.subj));
  else f.sort((a,b)=>(order[a.group]-order[b.group])||a.subj.localeCompare(b.subj)||a.cat.localeCompare(b.cat,undefined,{numeric:true})||a.sect.localeCompare(b.sect));
  let h=`<div class="grid"><div>
    <div class="filters">
      <input id="q" placeholder="Search course, professor, or classmate…" value="${esc(search)}" oninput="search=this.value;rerenderKeep('q')">
      <select onchange="fSubj=this.value;render()"><option value="ALL">All subjects</option>${subjs.map(s=>`<option${fSubj===s?" selected":""}>${s}</option>`).join("")}</select>
      <select onchange="fWhen=this.value;render()">${[["ALL","Any time"],["DAY","Daytime"],["EVE","Evening"],["MW","Mon/Wed"],["TTH","Tue/Thu"],["SHORT","ACE & Wash. Campus"]].map(([v,l])=>`<option value="${v}"${fWhen===v?" selected":""}>${l}</option>`).join("")}</select>
    </div>
    <div class="sortbar"><span class="lbl">Sort</span>${[["group","Section"],["time","Time"],["popular","Most popular"]].map(([k,l])=>`<button class="pill ${sortBy===k?"on":""}" onclick="sortBy='${k}';render()">${l}</button>`).join("")}
      <span style="flex:1"></span><button class="pill fr ${onlyFriends?"on":""}" onclick="onlyFriends=!onlyFriends;render()">★ Friends' picks</button></div>
    <div class="card">`;
  if(!f.length)h+=`<div class="empty">${onlyFriends&&!friends.size?"Star friends on the Classmates tab to filter by their picks.":"No courses match these filters."}</div>`;
  let last=null;
  f.forEach(c=>{if(sortBy==="group"&&c.group!==last){h+=`<div class="sec-h">${GROUP_LABEL[c.group]}</div>`;last=c.group}h+=rowHTML(c,confIds,mm)});
  h+=`</div></div><div><div class="side"><h3>My schedule (${sel.length})</h3>`;
  if(!sel.length)h+=`<div class="empty">Tap courses to add them.<br>Your picks save automatically and your classmates see them live.</div>`;
  sel.forEach(c=>{const k=col(c),n=(mm[c.id]||[]).length;h+=`<div class="sc" style="background:${k.bg};border-left:3px solid ${k.b}"><div style="flex:1;min-width:0"><div class="code" style="color:${k.t}">${esc(code(c))} · ${esc(c.title)}</div><div class="t">${esc(c.pattern)}${SESS[c.session]&&c.group!=="ACE"&&c.group!=="DC"?" · "+SESS[c.session]:""}${n?` · ${n} classmate${n>1?"s":""}`:""}</div></div>${confIds.has(c.id)?"⚠️":""}<button class="x" onclick="toggle('${c.id}')" title="Remove">×</button></div>`});
  if(sel.length)h+=`<button class="cta" onclick="go('week')">See my week →</button><button class="cta alt" onclick="go('people')">Who's in my classes?</button>`;
  h+=`</div></div></div>`;
  return h;
}

function layoutDay(items){ // assign lanes to overlapping blocks
  items.sort((a,b)=>a.s.start-b.s.start||a.s.end-b.s.end);
  const groups=[];let cur=[],end=-1;
  items.forEach(it=>{if(it.s.start>=end&&cur.length){groups.push(cur);cur=[]}cur.push(it);end=Math.max(end,it.s.end)});
  if(cur.length)groups.push(cur);
  groups.forEach(g=>{const lanes=[];g.forEach(it=>{let l=lanes.findIndex(e=>e<=it.s.start);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=it.s.end;it.lane=l});g.forEach(it=>it.lanes=lanes.length)});
  return items;
}

function calendarHTML(mine,confIds,mm,ghost){
  const total=(EH-SH)*60,H=total*0.75;
  let lbl="",lines="";
  for(let i=0;i<EH-SH;i++){const hr=SH+i,top=i/(EH-SH)*100;lbl+=`<div class="tl" style="top:${top}%">${hr>12?hr-12:hr}${hr>=12?"p":"a"}</div>`;lines+=`<div class="hl" style="top:${top}%"></div>`}
  const cols=DAYS.map(day=>{
    const items=[];
    mine.forEach(c=>c.slots.filter(s=>s.day===day).forEach(s=>items.push({c,s,g:false})));
    (ghost||[]).forEach(c=>c.slots.filter(s=>s.day===day).forEach(s=>items.push({c,s,g:true})));
    layoutDay(items);
    const blocks=items.map(({c,s,g,lane,lanes})=>{const k=col(c),top=(s.start-SH*60)/total*100,ht=(s.end-s.start)/total*100,w=100/lanes;
      const n=(mm[c.id]||[]).length;
      return`<div class="blk${!g&&confIds.has(c.id)?" conf":""}${g?" ghost":""}" style="top:${top}%;height:${ht}%;left:calc(${lane*w}% + 3px);width:calc(${w}% - 6px);background:${k.b};--gc:${k.b}" title="${esc(code(c)+" — "+c.title+" ("+c.pattern+")")}">
        <div class="c">${esc(code(c))}${SESS[c.session]?` <span style="font-weight:500;opacity:.8">${SESS[c.session]}</span>`:""}</div><div class="tt">${esc(c.title)}</div><div class="s">${fmt(s.start)}–${fmt(s.end)} · ${esc(c.loc)}</div>${!g&&n?`<div class="s">👥 ${n}</div>`:""}</div>`}).join("");
    return`<div class="dc"><div class="dh">${day.toUpperCase()}</div><div class="body" style="height:${H}px">${lines}${blocks}</div></div>`}).join("");
  const used=[...new Set([...mine,...(ghost||[])].map(c=>c.subj))];
  return`<div class="cal"><div class="cg"><div><div class="dh" style="font-size:10px;color:var(--faint)">TIME</div><div class="body" style="height:${H}px">${lbl}</div></div>${cols}</div>
  <div class="legend">${used.map(s=>`<span><i style="background:${(COL[s]||COL.BUS).b}"></i>${s}</span>`).join("")}${ghost?`<span><i style="border:2px dashed #888;background:#fff"></i>Overlay</span>`:""}</div></div>`;
}

function renderWeek(sel,confIds,mm){
  const ppl=others().sort((a,b)=>(friends.has(b[0])-friends.has(a[0]))||a[1].name.localeCompare(b[1].name));
  const ou=overlayId&&users[overlayId];
  const ghost=ou?(ou.courses||[]).map(i=>BYID[i]).filter(c=>c&&!selected.has(c.id)):null;
  let h=`<div class="cal-tools"><b style="font-size:14px">My week</b><span style="flex:1"></span><span style="color:var(--mute)">Compare with</span>
    <select onchange="overlayId=this.value;render()"><option value="">— nobody —</option>${ppl.map(([id,u])=>`<option value="${id}"${overlayId===id?" selected":""}>${friends.has(id)?"★ ":""}${esc(u.name)}</option>`).join("")}</select></div>`;
  if(ou){const shared=(ou.courses||[]).filter(i=>selected.has(i)).length;h+=`<div style="font-size:12px;color:var(--mute);margin-bottom:10px">Solid = your classes · dashed = ${esc(ou.name)}'s other classes · you share <b style="color:var(--accent)">${shared}</b></div>`}
  if(!sel.length&&!ghost)return h+`<div class="card"><div class="empty" style="padding:48px">No courses yet.<br><button class="cta" style="width:auto;padding:9px 18px" onclick="go('list')">Pick courses</button></div></div>`;
  h+=calendarHTML(sel,confIds,mm,ghost);
  const off=sel.filter(c=>!c.slots.length);
  if(off.length)h+=`<div class="panel offgrid"><h3>Outside the weekly grid</h3><p class="sub">January ACE & Washington Campus</p>${off.map(c=>{const k=col(c);return`<div class="sc" style="background:${k.bg};border-left:3px solid ${k.b}"><div style="flex:1"><div class="code" style="color:${k.t}">${esc(code(c))} · ${esc(c.title)}</div><div class="t">${esc(c.pattern)} · ${esc(c.loc)}</div></div><button class="x" onclick="toggle('${c.id}')">×</button></div>`}).join("")}</div>`;
  return h;
}

function renderPeople(mm){
  const ppl=others().map(([id,u])=>({id,name:u.name,courses:(u.courses||[]).filter(i=>BYID[i]),updated:u.updated||0})).map(p=>({...p,shared:p.courses.filter(i=>selected.has(i))}));
  const q=peopleQ.toLowerCase();
  const list=ppl.filter(p=>!q||p.name.toLowerCase().includes(q)).sort((a,b)=>(friends.has(b.id)-friends.has(a.id))||(b.shared.length-a.shared.length)||a.name.localeCompare(b.name));
  let h=`<div class="share"><div class="txt"><h3>🔗 Invite your class</h3><p>Everyone who opens this link joins the same live board.</p><div class="url">${esc(link())}</div></div>
    <div class="acts"><button class="b-w" onclick="copyLink()">Copy link</button><button class="b-wa" onclick="wa()">WhatsApp</button></div></div>
  <div class="two"><div>`;
  // person detail
  const p=personId&&ppl.find(x=>x.id===personId);
  if(p){
    const cs=p.courses.map(i=>BYID[i]).sort((a,b)=>(a.slots[0]?.start??9999)-(b.slots[0]?.start??9999));
    h+=`<div class="panel" style="margin-bottom:16px"><div class="prof-h">${av(p.name,44)}<div style="flex:1"><div class="nm">${esc(p.name)}</div><div class="mt">${cs.length} course${cs.length===1?"":"s"} · ${p.shared.length} with you</div></div>
      <button class="star ${friends.has(p.id)?"on":""}" title="Star as friend" onclick="star('${p.id}',event)">★</button><button class="x" onclick="personId=null;render()" title="Close">×</button></div>
      ${cs.length?cs.map(c=>{const k=col(c),mine=selected.has(c.id);return`<div class="pc"><span class="chip" style="background:${k.bg};color:${k.t}">${esc(code(c))}</span><div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600">${esc(c.title)}</div><div class="meta" style="margin-top:1px">${esc(c.pattern)} · ${esc(c.prof)}</div></div><button class="add ${mine?"on":""}" style="${mine?`background:${k.b}`:""}" onclick="toggle('${c.id}')">${mine?"✓ Taking":"+ Add"}</button></div>`}).join(""):`<div class="empty">No courses picked yet.</div>`}
      ${cs.length?`<button class="cta" onclick="compare('${p.id}')">Compare our weeks →</button>`:""}</div>`;
  }
  h+=`<div class="panel"><h3>👥 Classmates (${ppl.length})</h3><p class="sub">★ star your friends to highlight their picks everywhere</p>
    <input id="pq" placeholder="Find a classmate…" value="${esc(peopleQ)}" oninput="peopleQ=this.value;rerenderKeep('pq')">`;
  if(!ppl.length)h+=`<div class="empty">Nobody else yet — share the link above.</div>`;
  list.forEach(u=>{h+=`<div class="pr${personId===u.id?" on":""}" onclick="openPerson('${u.id}')"><button class="star ${friends.has(u.id)?"on":""}" onclick="star('${u.id}',event)">★</button>${av(u.name,34)}<div style="flex:1;min-width:0"><div class="nm">${esc(u.name)}</div><div class="mt">${u.courses.length} course${u.courses.length===1?"":"s"} planned</div></div><div class="shared"><b>${u.shared.length}</b><div>shared</div></div></div>`});
  h+=`</div></div><div>`;
  // popular
  const pop=COURSES.map(c=>({c,n:(mm[c.id]||[]).length+(selected.has(c.id)?1:0)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
  h+=`<div class="panel"><h3>🔥 Most popular</h3><p class="sub">Courses with the most classmates</p>`;
  if(!pop.length)h+=`<div class="empty">No picks yet — be the first!</div>`;
  pop.forEach(({c,n},i)=>{const k=col(c),mine=selected.has(c.id),ms=mm[c.id]||[];h+=`<div class="pop"><div class="rank" style="background:${k.bg};color:${k.t}">${i+1}</div><div style="flex:1;min-width:0"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="chip" style="background:${k.bg};color:${k.t}">${esc(code(c))}</span><span style="font-size:12.5px;font-weight:600">${esc(c.title)}</span></div><div class="meta">${esc(c.pattern)} · <b>${n}</b> taking${ms.some(m=>friends.has(m.id))?` · ★ ${ms.filter(m=>friends.has(m.id)).map(m=>esc(m.name.split(" ")[0])).join(", ")}`:""}</div></div><button class="add ${mine?"on":""}" style="${mine?`background:${k.b}`:""}" onclick="toggle('${c.id}')">${mine?"✓ Added":"+ Add"}</button></div>`});
  h+=`</div></div></div>`;
  return h;
}

// ─── Init ───
load();
let gotM=false,gotL=false;
function onData(){if(!gotM||!gotL)return;rebuildUsers();loaded=true;const a=document.activeElement;const id=a&&a.id;const val=a&&a.value;render();if(id){const n=document.getElementById(id);if(n&&n.tagName==="INPUT"){if(val!=null&&n.value!==val)n.value=val;n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(e){}}}}
function fail(e){console.error(e);document.getElementById("app").innerHTML=`<div class="loading">⚠️ Couldn't connect. Try refreshing.</div>`}
auth.onAuthStateChanged(u=>{
  if(!u){auth.signInAnonymously().catch(fail);return}
  if(uid)return;uid=u.uid;
  db.ref(ROOT+"/members").on("value",s=>{members=s.val()||{};gotM=true;onData()},fail);
  db.ref(ROOT+"/users").on("value",s=>{legacy=s.val()||{};gotL=true;onData()},fail);
});
